name: Hardware report
description: Report what works or fails on your mouse (especially buttons, macros, factory presets, sleep, debounce)
labels: [hardware-report]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing. See `docs/hardware-testing.md` for safe test steps.
        Never paste anything private. Reports contain no serial numbers or personal data.
  - type: input
    id: model
    attributes:
      label: Mouse model and connection
      placeholder: "X11, 2.4G dongle / wired / Bluetooth"
    validations:
      required: true
  - type: textarea
    id: lsusb
    attributes:
      label: Output of `lsusb -d 1d57:`
      render: text
    validations:
      required: true
  - type: textarea
    id: raw
    attributes:
      label: Output of `attackshark-x11 raw`
      render: text
    validations:
      required: true
  - type: textarea
    id: tested
    attributes:
      label: What you tested and the result
      description: Command run, expected effect, observed effect, for each feature (button, macro, preset, sleep, debounce...).
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Distro, kernel, tool version (`attackshark-x11 --version`)
    validations:
      required: true
